# Configuración base para no repetir código
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # En producción, Rails usará la variable DATABASE_URL de Render.
  username: postgres
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "123456" } %>
  host: localhost

development:
  <<: *default
  database: levelup_academy_development

test:
  <<: *default
  database: levelup_academy_test

# Configuración de producción para Render + Supabase (Rails 8)
production:
  primary:
    <<: *default
    url: <%= ENV['DATABASE_URL'] %>
    # FIX: Desactiva prepared statements para evitar errores con el Pooler de Supabase
    prepared_statements: false

  # Bases de datos internas de Rails 8 (apuntan a la misma DB en el plan gratuito)
  cache:
    <<: *default
    url: <%= ENV['DATABASE_URL'] %>
    prepared_statements: false
    migrations_paths: db/cache_migrate

  queue:
    <<: *default
    url: <%= ENV['DATABASE_URL'] %>
    prepared_statements: false
    migrations_paths: db/queue_migrate

  cable:
    <<: *default
    url: <%= ENV['DATABASE_URL'] %>
    prepared_statements: false
    migrations_paths: db/cable_migrate